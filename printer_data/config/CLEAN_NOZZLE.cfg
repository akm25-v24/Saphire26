[gcode_macro CLEAN_NOZZLE]
description: "Cleans the nozzle by wiping on a brush/pad. Heats to 150C before cleaning."
gcode:
    {% set save_gcode_state = 'SAVE_GCODE_STATE' in printer.gcode_macros %}
    {% if save_gcode_state %}
        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    {% endif %}

    # Heat nozzle to 150C and wait
    M109 S150

    # Move to cleaning area (adjust X and Y based on your setup)
    G90
    G1 X255 Y355 F5000
    G1 Z3.5

    # Perform wiping motion
    G1 X255 F6000
    G1 X305 F6000
    G1 X255 F6000
    G1 X305 F6000
    G1 X255 F6000
    G1 X305 F6000
    G1 X255 F6000
    G1 X305 F6000
    G1 X255 F6000
    G1 X305 F6000
    G1 X255 F6000
    G1 X305 F6000

    {% if save_gcode_state %}
        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    {% endif %}